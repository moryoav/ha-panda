sequence:
  - action: weather.get_forecasts
    target:
      entity_id: weather.openweathermap
    data:
      type: daily
    response_variable: weather_response
  - variables:
      forecasts: "{{ weather_response['weather.openweathermap'].forecast }}"
      daily_weather_icon_overrides:
        clear-night: sunny
      grid_x_start: 5
      cell_width: 49
      cell_top: 7
      cell_bottom: 121
      label_y: 17
      icon_y: 50
      temp_y: 83
      rain_y: 106
  - action: panda_esl.write
    target:
      device_id: 02f83e543608fe720312585eaedf153c
    data:
      background: white
      payload:
        - type: line
          x_start: "{{ grid_x_start + cell_width }}"
          x_end: "{{ grid_x_start + cell_width }}"
          y_start: "{{ cell_top }}"
          y_end: "{{ cell_bottom }}"
          width: 1
          fill: black
        - type: line
          x_start: "{{ grid_x_start + (cell_width * 2) }}"
          x_end: "{{ grid_x_start + (cell_width * 2) }}"
          y_start: "{{ cell_top }}"
          y_end: "{{ cell_bottom }}"
          width: 1
          fill: black
        - type: line
          x_start: "{{ grid_x_start + (cell_width * 3) }}"
          x_end: "{{ grid_x_start + (cell_width * 3) }}"
          y_start: "{{ cell_top }}"
          y_end: "{{ cell_bottom }}"
          width: 1
          fill: black
        - type: line
          x_start: "{{ grid_x_start + (cell_width * 4) }}"
          x_end: "{{ grid_x_start + (cell_width * 4) }}"
          y_start: "{{ cell_top }}"
          y_end: "{{ cell_bottom }}"
          width: 1
          fill: black
        - type: line
          x_start: 5
          x_end: 251
          y_start: 28
          y_end: 28
          width: 1
          fill: black
        - type: text
          value: TODAY
          x: "{{ grid_x_start + (cell_width * 0.5) }}"
          "y": "{{ label_y }}"
          size: 9
          color: black
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
          visible: "{{ (forecasts | count) > 0 }}"
        - type: icon
          value: >-
            {% if (forecasts | count) > 0 %}{% set condition =
            forecasts[0].condition | default('cloudy', true) %}weather-{{
            daily_weather_icon_overrides[condition] if condition in
            daily_weather_icon_overrides else condition }}{% else
            %}weather-cloudy{% endif %}
          x: "{{ grid_x_start + (cell_width * 0.5) }}"
          "y": "{{ icon_y }}"
          size: 24
          color: >-
            {% if (forecasts | count) > 0 and forecasts[0].condition in
            ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy'] %}red{% else
            %}black{% endif %}
          anchor: mm
          visible: "{{ (forecasts | count) > 0 }}"
        - type: text
          value: >-
            {% if (forecasts | count) > 0 %}{% set high =
            forecasts[0].temperature | round(0) | int %}{% set low =
            forecasts[0].templow if forecasts[0].templow is defined and
            forecasts[0].templow is not none else none %}{{ high }}{% if low is
            not none %}/{{ low | round(0) | int }}{% endif %}C{% endif %}
          x: "{{ grid_x_start + (cell_width * 0.5) }}"
          "y": "{{ temp_y }}"
          size: 9
          color: black
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
          visible: "{{ (forecasts | count) > 0 }}"
        - type: text
          value: >-
            {% if (forecasts | count) > 0 and forecasts[0].precipitation_probability
            is defined and forecasts[0].precipitation_probability is not none
            %}{{ forecasts[0].precipitation_probability | round(0) | int }}%{% endif %}
          x: "{{ grid_x_start + (cell_width * 0.5) }}"
          "y": "{{ rain_y }}"
          size: 8
          color: red
          anchor: mm
          font: fonts/NotoSansKR-Regular.ttf
          visible: >-
            {{ (forecasts | count) > 0 and forecasts[0].precipitation_probability
            is defined and forecasts[0].precipitation_probability is not none and
            (forecasts[0].precipitation_probability | float(0)) > 0 }}
        - type: text
          value: >-
            {% if (forecasts | count) > 1 %}{{ as_datetime(forecasts[1].datetime)
            .strftime('%a') }}{% endif %}
          x: "{{ grid_x_start + (cell_width * 1.5) }}"
