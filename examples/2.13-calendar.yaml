sequence:
  - variables:
      days_in_month: >-
        {{ ((now().replace(day=1) + timedelta(days=32)).replace(day=1) -
        timedelta(days=1)).day }}
      start_weekday_offset: "{{ (now().replace(day=1).weekday() + 1) % 7 }}"
      grid_x_start: 9
      cell_width: 34
      cell_height: 16
      header_y: 17
      grid_y_start: 30
  - action: panda_esl.write
    target:
      device_id: 02f83e543608fe720312585eaedf153c
    data:
      background: white
      payload:
        - type: text
          value: S
          x: "{{ grid_x_start + (cell_width * 0.5) }}"
          "y": "{{ header_y }}"
          size: 12
          color: black
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: M
          x: "{{ grid_x_start + (cell_width * 1.5) }}"
          "y": "{{ header_y }}"
          size: 12
          color: black
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: T
          x: "{{ grid_x_start + (cell_width * 2.5) }}"
          "y": "{{ header_y }}"
          size: 12
          color: black
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: W
          x: "{{ grid_x_start + (cell_width * 3.5) }}"
          "y": "{{ header_y }}"
          size: 12
          color: black
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: T
          x: "{{ grid_x_start + (cell_width * 4.5) }}"
          "y": "{{ header_y }}"
          size: 12
          color: black
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: F
          x: "{{ grid_x_start + (cell_width * 5.5) }}"
          "y": "{{ header_y }}"
          size: 12
          color: red
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
        - type: text
          value: S
          x: "{{ grid_x_start + (cell_width * 6.5) }}"
          "y": "{{ header_y }}"
          size: 12
          color: red
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
        - type: line
          x_start: 8
          x_end: 248
          y_start: 26
          y_end: 26
          width: 1
          fill: black
        - type: circle
          x: >-
            {{ grid_x_start + ((((start_weekday_offset | int) + (now().day - 1))
            % 7) * cell_width) + (cell_width / 2) }}
          "y": >-
            {{ grid_y_start + ((((start_weekday_offset | int) + (now().day - 1))
            // 7) * cell_height) + (cell_height / 2) }}
          radius: 8
          fill: black
          outline: black
        - type: text
          value: "1"
          x: >-
            {{ grid_x_start + ((((start_weekday_offset | int) + 0) % 7) *
            cell_width) + (cell_width / 2) }}
          "y": >-
            {{ grid_y_start + ((((start_weekday_offset | int) + 0) // 7) *
            cell_height) + (cell_height / 2) }}
          size: 11
          anchor: mm
          font: fonts/NotoSansKR-Bold.ttf
          color: >-
            {{ 'white' if 1 == now().day else ('red' if (((start_weekday_offset
            | int) + 0) % 7) in [5, 6] else 'black') }}
          visible: "{{ 1 <= (days_in_month | int) }}"
